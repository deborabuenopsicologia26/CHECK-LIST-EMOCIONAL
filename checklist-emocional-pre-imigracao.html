<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Emocional Pré-Imigração | Débora Bueno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brown: #6B5744;
    --brown-dark: #4A3C2E;
    --sand: #F2E9DA;
    --sand-deep: #E4D5BC;
    --tide: #4B7A8C;
    --tide-dark: #345A69;
    --sim: #7C8A63;
    --mais: #C79A4B;
    --nao: #AD5A45;
    --paper: #FBF8F2;
    --ink: #362B22;
    --radius: 14px;
    --shadow: 0 8px 28px rgba(74,60,46,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    background: var(--sand);
    color: var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 36px 20px 80px;
  }
  .eyebrow{
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--tide-dark);
    font-weight: 600;
    text-align:center;
    margin-bottom: 10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.15;
    text-align:center;
    color: var(--brown-dark);
    margin: 0 0 14px;
  }
  .lede{
    text-align:center;
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink);
    opacity:.85;
    max-width: 480px;
    margin: 0 auto 36px;
  }

  /* compass progress */
  .compass-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    margin-bottom: 30px;
  }
  .compass{ position:relative; width:64px; height:64px; flex-shrink:0; }
  .compass svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .compass circle.track{ fill:none; stroke: var(--sand-deep); stroke-width:6; }
  .compass circle.fill{ fill:none; stroke: var(--tide); stroke-width:6; stroke-linecap:round; transition: stroke-dashoffset .6s ease; }
  .compass .needle{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-size:14px; color:var(--brown-dark); font-weight:500;
  }
  .compass-label{ font-size:13px; color:var(--brown); }
  .compass-label b{ color: var(--brown-dark); }

  .card{
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 26px;
  }

  .section-title{
    font-family:'Fraunces', serif;
    font-size: 22px;
    color: var(--brown-dark);
    margin: 0 0 4px;
  }
  .section-index{
    font-size: 13px;
    color: var(--tide-dark);
    font-weight:600;
    letter-spacing:.06em;
    margin-bottom: 18px;
  }

  .item{
    padding: 18px 0;
    border-top: 1px solid var(--sand-deep);
  }
  .item:first-of-type{ border-top: none; padding-top:4px; }
  .item p{
    margin: 0 0 12px;
    font-size: 15.5px;
    line-height:1.5;
    color: var(--ink);
  }
  .options{
    display:flex;
    gap: 8px;
  }
  .opt{
    flex:1;
    border: 1.5px solid var(--sand-deep);
    background: #fff;
    border-radius: 999px;
    padding: 10px 6px;
    font-size: 13.5px;
    font-weight: 600;
    text-align:center;
    cursor:pointer;
    transition: all .15s ease;
    color: var(--brown);
    user-select:none;
  }
  .opt:hover{ border-color: var(--tide); }
  .opt.sel-sim{ background: var(--sim); border-color: var(--sim); color:#fff; }
  .opt.sel-mais{ background: var(--mais); border-color: var(--mais); color:#fff; }
  .opt.sel-nao{ background: var(--nao); border-color: var(--nao); color:#fff; }

  .blurb{
    margin-top: 22px;
    padding: 16px 18px;
    background: var(--sand);
    border-radius: 10px;
    font-size: 14.5px;
    font-style: italic;
    color: var(--brown-dark);
    line-height:1.5;
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top: 28px;
  }
  button.primary{
    background: var(--brown-dark);
    color:#fff;
    border:none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 15px;
    font-weight:600;
    font-family:'Work Sans',sans-serif;
    cursor:pointer;
    transition: opacity .15s;
  }
  button.primary:disabled{ opacity:.4; cursor:not-allowed; }
  button.primary:not(:disabled):hover{ opacity:.88; }
  button.ghost{
    background:none;
    border:none;
    color: var(--brown);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding: 8px;
  }
  button.ghost:disabled{ opacity:0; cursor:default; }

  /* intro screen */
  .intro-card{ text-align:center; }
  .legend{
    display:flex;
    justify-content:center;
    gap: 18px;
    flex-wrap:wrap;
    margin: 22px 0 28px;
    font-size: 13.5px;
  }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .dot.sim{background:var(--sim);} .dot.mais{background:var(--mais);} .dot.nao{background:var(--nao);}

  /* gate screen */
  .gate-card{ text-align:center; }
  .gate-icon{ font-size: 34px; margin-bottom: 12px; }
  form.gate-form{ margin-top: 22px; text-align:left; }
  label{ font-size:13.5px; font-weight:600; color:var(--brown-dark); display:block; margin-bottom:6px; }
  input[type=text], input[type=email]{
    width:100%;
    padding: 13px 15px;
    border-radius: 10px;
    border: 1.5px solid var(--sand-deep);
    font-size: 15px;
    font-family:'Work Sans',sans-serif;
    margin-bottom: 16px;
    background:#fff;
    color: var(--ink);
  }
  input:focus{ outline:2px solid var(--tide); outline-offset:1px; }
  .privacy-note{ font-size:12px; color:var(--brown); opacity:.75; margin-top:-6px; margin-bottom:18px; }
  .error-msg{ color:var(--nao); font-size:13px; margin: -8px 0 14px; display:none; }

  /* result screen */
  .result-intro{ text-align:center; margin-bottom: 30px; }
  .result-intro p{ font-size:14.5px; line-height:1.65; color:var(--brown-dark); opacity:.85; text-align:left; margin: 0 0 14px; }

  .result-hero{ margin-bottom: 30px; }
  .result-hero .tag{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    letter-spacing:.04em;
    color:#fff;
    padding: 6px 16px;
    border-radius:999px;
    margin-bottom: 14px;
  }
  .tag.base-boa{ background: var(--sim); }
  .tag.atencao{ background: var(--mais); }
  .tag.impulso{ background: var(--nao); }
  .result-hero h2{
    font-family:'Fraunces',serif;
    font-size: 22px;
    color: var(--brown-dark);
    margin: 0 0 16px;
    line-height: 1.3;
  }
  .result-hero p{ font-size:15px; line-height:1.65; color:var(--ink); opacity:.92; text-align:left; margin: 0 0 14px; }

  .result-closing{ margin-top: 32px; text-align:center; }
  .result-closing p{ font-size:14.5px; line-height:1.65; color:var(--brown-dark); opacity:.85; text-align:left; margin: 0 0 14px; }

  .breakdown{ margin: 26px 0; }
  .row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--sand-deep);
    font-size: 14px;
  }
  .row:first-child{ border-top:none; }
  .row .name{ flex: 1 1 auto; color: var(--brown-dark); font-weight:500; }
  .row .pill{
    font-size:12px;
    font-weight:700;
    padding: 4px 12px;
    border-radius:999px;
    color:#fff;
    white-space:nowrap;
  }

  .cta-block{
    margin-top: 30px;
    padding: 24px 22px;
    background: var(--tide);
    border-radius: 14px;
    text-align:center;
  }
  .cta-block h3{
    font-family:'Fraunces',serif;
    color:#fff;
    font-size:19px;
    margin:0 0 8px;
  }
  .cta-block p{ color:#EAF3F5; font-size:14px; line-height:1.55; margin:0 0 16px; }
  a.cta-link{
    display:inline-block;
    background:#fff;
    color: var(--tide-dark);
    font-weight:700;
    font-size:14.5px;
    padding: 12px 26px;
    border-radius:999px;
    text-decoration:none;
  }

  .footer-note{
    text-align:center;
    font-size:12.5px;
    color: var(--brown);
    opacity:.7;
    margin-top: 26px;
  }

  @media (max-width:420px){
    .card{ padding: 24px 18px; }
    .options{ flex-direction:column; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="eyebrow">Débora Bueno · Psi no Exterior</div>
  <h1>Checklist Emocional Pré-Imigração</h1>
  <p class="lede">Um convite honesto para olhar para dentro antes de mudar de país.</p>

  <div class="compass-row" id="compassRow" style="display:none;">
    <div class="compass">
      <svg viewBox="0 0 64 64">
        <circle class="track" cx="32" cy="32" r="27"></circle>
        <circle class="fill" id="compassFill" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"></circle>
      </svg>
      <div class="needle" id="compassNum">1/7</div>
    </div>
    <div class="compass-label">Sua bússola emocional<br><b id="compassText">bloco 1 de 7</b></div>
  </div>

  <div class="card" id="app"></div>

  <p class="footer-note">Isso não é sobre certo ou errado — é sobre consciência.</p>
</div>

<script>
const SECTIONS = [
  {
    title: "Expectativa vs Realidade",
    items: [
      "Eu consigo diferenciar o que é sonho e o que é realidade na imigração",
      "Eu sei que a adaptação envolve perdas, não só ganhos",
      "Eu estou preparado(a) para recomeçar, mesmo depois de já ter construído muito",
      "Eu aceito que posso me sentir deslocado(a) por um tempo",
      "Eu consigo sustentar a decisão mesmo quando o entusiasmo diminuir"
    ],
    blurb: "Imigrar esperando só o lado bom costuma cobrar caro depois."
  },
  {
    title: "Identidade e Pertencimento",
    items: [
      "Eu sei quem eu sou além da minha profissão",
      "Eu não dependo apenas de validação externa para me sentir suficiente",
      "Eu estou disposto(a) a reconstruir partes da minha identidade",
      "Eu consigo lidar com a sensação de não pertencimento sem me desorganizar",
      "Eu aceito que minha versão lá fora pode ser diferente da atual"
    ],
    blurb: "Quando o que te definia muda, algo interno precisa sustentar você."
  },
  {
    title: "Regulação Emocional",
    items: [
      "Eu consigo identificar quando estou ansioso(a), irritado(a) ou sobrecarregado(a)",
      "Eu tenho estratégias para lidar com estresse (além de evitar ou explodir)",
      "Eu consigo pausar antes de reagir",
      "Eu sei pedir ajuda quando necessário",
      "Eu não uso apenas distração ou fuga para lidar com emoções difíceis"
    ],
    blurb: "Sem regulação emocional, qualquer mudança vira sobrecarga."
  },
  {
    title: "Flexibilidade Cognitiva",
    items: [
      "Eu consigo lidar com mudanças de plano sem entrar em crise",
      "Eu tolero frustração sem me paralisar",
      "Eu consigo ajustar expectativas quando a realidade muda",
      "Eu estou aberto(a) a fazer diferente do que estou acostumado(a)",
      "Eu entendo que adaptação exige mudança"
    ],
    blurb: "Rigidez mental aumenta sofrimento. Flexibilidade sustenta adaptação."
  },
  {
    title: "Dinâmica Familiar",
    items: [
      "As expectativas da família estão alinhadas (ou pelo menos conversadas)",
      "Eu sei como cada membro tende a reagir ao estresse",
      "Existe abertura para diálogo em momentos difíceis",
      "Eu não estou usando a mudança como solução mágica",
      "Eu pensei no impacto real da mudança nos filhos (se houver)"
    ],
    blurb: "A imigração não cria problemas — ela amplifica o que já existe."
  },
  {
    title: "Rede de Apoio",
    items: [
      "Eu sei com quem posso contar emocionalmente",
      "Eu estou disposto(a) a construir novas conexões",
      "Eu não dependo exclusivamente de uma única pessoa",
      "Eu sei onde buscar ajuda profissional se precisar",
      "Eu aceito que pedir ajuda faz parte do processo"
    ],
    blurb: "Solidão não aparece de repente — ela se constrói no silêncio."
  },
  {
    title: "Organização Prática",
    items: [
      "Eu tenho uma noção realista do custo de vida",
      "Eu sei quais serão meus primeiros passos ao chegar",
      "Eu tenho uma rotina mínima pensada",
      "Eu entendo que desorganização prática aumenta ansiedade",
      "Eu me sinto minimamente preparado(a) para começar"
    ],
    blurb: "Ambiente caótico → mente sobrecarregada."
  }
];

// ---- STATE ----
let screen = "intro"; // intro | section | gate | result
let sectionIdx = 0;
let answers = SECTIONS.map(s => new Array(s.items.length).fill(null)); // 'sim'|'mais'|'nao'

const app = document.getElementById("app");
const compassRow = document.getElementById("compassRow");
const compassFill = document.getElementById("compassFill");
const compassNum = document.getElementById("compassNum");
const compassText = document.getElementById("compassText");
const CIRC = 169.6;

function updateCompass(){
  if(screen === "section"){
    compassRow.style.display = "flex";
    const progress = sectionIdx / SECTIONS.length;
    compassFill.style.strokeDashoffset = CIRC - (CIRC * progress);
    compassNum.textContent = (sectionIdx+1) + "/" + SECTIONS.length;
    compassText.textContent = "bloco " + (sectionIdx+1) + " de " + SECTIONS.length;
  } else if(screen === "gate" || screen === "result"){
    compassRow.style.display = "flex";
    compassFill.style.strokeDashoffset = 0;
    compassNum.textContent = "✓";
    compassText.textContent = screen === "gate" ? "quase lá" : "concluído";
  } else {
    compassRow.style.display = "none";
  }
}

function render(){
  updateCompass();
  if(screen === "intro") return renderIntro();
  if(screen === "section") return renderSection();
  if(screen === "gate") return renderGate();
  if(screen === "result") return renderResult();
}

function renderIntro(){
  app.innerHTML = `
    <div class="intro-card">
      <p style="font-size:15.5px; line-height:1.7; color:var(--ink); margin-bottom:6px;">
        Antes de começar, um ponto importante:<br>
        isso aqui não é sobre certo ou errado. É sobre consciência.
      </p>
      <p style="font-size:14.5px; line-height:1.6; color:var(--brown); opacity:.85;">
        Leia cada frase ao longo dos 7 blocos e marque o que é mais verdadeiro pra você hoje.
        Seja honesto — porque lá fora, a realidade costuma cobrar isso de volta.
      </p>
      <div class="legend">
        <span><i class="dot sim"></i> Já está claro pra mim</span>
        <span><i class="dot mais"></i> Ainda oscila</span>
        <span><i class="dot nao"></i> Ainda não parei pra olhar</span>
      </div>
      <button class="primary" onclick="goToSection(0)">Começar o checklist</button>
    </div>
  `;
}

function renderSection(){
  const sec = SECTIONS[sectionIdx];
  const ans = answers[sectionIdx];
  const allAnswered = ans.every(a => a !== null);

  let itemsHtml = sec.items.map((text, i) => `
    <div class="item">
      <p>${text}</p>
      <div class="options">
        <div class="opt ${ans[i]==='sim'?'sel-sim':''}" onclick="setAnswer(${i},'sim')">✅ SIM</div>
        <div class="opt ${ans[i]==='mais'?'sel-mais':''}" onclick="setAnswer(${i},'mais')">⚠️ MAIS OU MENOS</div>
        <div class="opt ${ans[i]==='nao'?'sel-nao':''}" onclick="setAnswer(${i},'nao')">❌ NÃO</div>
      </div>
    </div>
  `).join("");

  app.innerHTML = `
    <div class="section-index">Bloco ${sectionIdx+1} de ${SECTIONS.length}</div>
    <div class="section-title">${sec.title}</div>
    ${itemsHtml}
    <div class="blurb">💬 ${sec.blurb}</div>
    <div class="nav-row">
      <button class="ghost" onclick="prevSection()" ${sectionIdx===0 ? 'disabled':''}>Voltar</button>
      <button class="primary" ${allAnswered? '' : 'disabled'} onclick="nextSection()">
        ${sectionIdx === SECTIONS.length-1 ? 'Ver meu resultado' : 'Próximo bloco'}
      </button>
    </div>
  `;
}

function setAnswer(i, val){
  answers[sectionIdx][i] = val;
  renderSection();
}

function goToSection(i){
  screen = "section";
  sectionIdx = i;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function prevSection(){
  if(sectionIdx > 0){
    sectionIdx--;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

function nextSection(){
  if(sectionIdx < SECTIONS.length - 1){
    sectionIdx++;
    render();
  } else {
    screen = "gate";
    render();
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderGate(){
  app.innerHTML = `
    <div class="gate-card">
      <div class="gate-icon">📥</div>
      <div class="section-title" style="text-align:center;">Seu resultado está pronto</div>
      <p style="font-size:14.5px; color:var(--brown); opacity:.9; margin-top:8px;">
        Me diz seu nome e e-mail pra eu te mostrar sua leitura completa —
        e te enviar, junto, orientações práticas sobre adaptação emocional no exterior.
      </p>
      <form class="gate-form" onsubmit="submitGate(event)">
        <label for="nameInput">Nome</label>
        <input type="text" id="nameInput" placeholder="Seu primeiro nome" required>
        <label for="emailInput">E-mail</label>
        <input type="email" id="emailInput" placeholder="seuemail@exemplo.com" required>
        <p class="error-msg" id="errorMsg">Digite um e-mail válido pra continuar.</p>
        <p class="privacy-note">Sem spam. Você pode cancelar a inscrição quando quiser.</p>
        <button class="primary" type="submit" style="width:100%;">Ver meu resultado</button>
      </form>
    </div>
  `;
}

function submitGate(e){
  e.preventDefault();
  const name = document.getElementById("nameInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!emailOk){
    document.getElementById("errorMsg").style.display = "block";
    return;
  }

  // === INTEGRAÇÃO COM BREVO ===
  // Substitua a linha abaixo pela action do seu formulário Brevo
  // (Brevo > Contacts > Forms > pegar o HTML do form e copiar o "action" e os campos hidden).
  // Exemplo de envio via fetch para não recarregar a página:
  //
  // fetch("URL_DO_SEU_FORMULARIO_BREVO", {
  //   method: "POST",
  //   mode: "no-cors",
  //   headers: {"Content-Type": "application/x-www-form-urlencoded"},
  //   body: new URLSearchParams({ EMAIL: email, PRENOM: name, ... campos_hidden_do_brevo })
  // });

  window.leadData = { name, email };
  screen = "result";
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function tally(arr){
  const t = {sim:0, mais:0, nao:0};
  arr.forEach(a => t[a]++);
  return t;
}

function dominant(t){
  if(t.nao >= t.sim && t.nao >= t.mais) return 'nao';
  if(t.mais >= t.sim) return 'mais';
  return 'sim';
}

const pillLabel = { sim: "Base sólida", mais: "Pede atenção", nao: "Ainda no impulso" };
const pillColor = { sim: "var(--sim)", mais: "var(--mais)", nao: "var(--nao)" };

const RESULT_INTRO = [
  "Antes de qualquer coisa, quero reforçar um ponto importante: este checklist não mede se você está \"pronto\" ou \"não pronto\" para imigrar. Ele também não prevê como será a sua adaptação.",
  "O objetivo é outro. Ele foi criado para ampliar sua percepção sobre aspectos emocionais que costumam influenciar profundamente a experiência de viver em outro país — e que, muitas vezes, passam despercebidos durante o planejamento.",
  "Mais do que encontrar respostas, este é um convite para fazer perguntas. E algumas delas podem mudar completamente a forma como você atravessa essa transição."
];

const RESULT_CLOSING = [
  "Independentemente do resultado, existe algo que eu gostaria que você levasse desta experiência: a preparação para a imigração não começa quando você faz as malas. Ela começa quando você começa a olhar para si com mais curiosidade do que julgamento.",
  "Nenhum checklist é capaz de traduzir toda a complexidade de uma pessoa ou de prever como será sua adaptação. Mas ele pode cumprir um papel importante: fazer perguntas que talvez você ainda não tivesse feito.",
  "E, muitas vezes, são essas perguntas — e não as respostas prontas — que mudam a forma como atravessamos uma grande transição.",
  "Se este material despertou reflexões, dúvidas ou trouxe à tona questões que você gostaria de compreender com mais profundidade, saiba que isso faz parte do processo. Às vezes, uma conversa ajuda a organizar aquilo que, sozinho, ainda parece confuso."
];

const heroCopy = {
  sim: {
    tag: "Base emocional em construção",
    tagClass: "base-boa",
    emoji: "🟢",
    title: "Se a maioria das suas respostas foi \"SIM\"",
    paragraphs: [
      "Isso sugere que você já começou a construir uma base emocional importante para enfrentar uma mudança tão significativa. Provavelmente você já refletiu sobre temas como adaptação, perdas, expectativas, flexibilidade e organização emocional.",
      "Essa é uma excelente notícia. Mas existe um cuidado importante: ter uma boa base não significa que a imigração será fácil ou que você estará protegido dos desafios que fazem parte desse processo. Ela apenas indica que você talvez tenha mais recursos para enfrentá-los quando surgirem.",

function renderResult(){
  const name = (window.leadData && window.leadData.name) || "";
  let totals = {sim:0, mais:0, nao:0};
  const rows = SECTIONS.map((sec, i) => {
    const t = tally(answers[i]);
    totals.sim += t.sim; totals.mais += t.mais; totals.nao += t.nao;
    const dom = dominant(t);
    return `<div class="row"><div class="name">${sec.title}</div><div class="pill" style="background:${pillColor[dom]}">${pillLabel[dom]}</div></div>`;
  }).join("");

  const overall = dominant(totals);
  const h = heroCopy[overall];
  const introHtml = RESULT_INTRO.map(t => `<p>${t}</p>`).join("");
  const bodyHtml = h.paragraphs.map(t => `<p>${t}</p>`).join("");
  const closingHtml = RESULT_CLOSING.map(t => `<p>${t}</p>`).join("");

  app.innerHTML = `
    <div class="result-intro">
      <div class="section-index" style="text-align:center;">🌱 Seu resultado${name ? ', '+name : ''}</div>
      ${introHtml}
    </div>
    <div class="result-hero">
      <span class="tag ${h.tagClass}">${h.emoji} ${h.tag}</span>
      <h2>${h.title}</h2>
      ${bodyHtml}
    </div>
    <div class="section-title" style="font-size:17px; text-align:center; margin-top:6px;">Sua leitura por bloco</div>
    <div class="breakdown">${rows}</div>
    <div class="result-closing">
      <div class="section-index" style="text-align:center;">🌱 Antes de encerrar...</div>
      ${closingHtml}
    </div>
    <div class="cta-block">
      <h3>Vamos conversar sobre o que veio à tona?</h3>
      <p>Conheça o Diagnóstico de Prontidão Emocional e receba, com calma, orientações práticas sobre adaptação emocional no exterior.</p>
      <a class="cta-link" href="https://deborabuenopsi.com/servicos" target="_top">Conhecer o Diagnóstico</a>
    </div>
  `;
}

render();
</script>
